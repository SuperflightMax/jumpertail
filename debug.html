<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tail Jumper - Debug</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-root" class="game-root--debug">
      <div class="game-stage">
        <canvas id="game-canvas"></canvas>
        <div id="overlay">click to jump</div>
        <div class="performance-monitor" data-performance-monitor>
          <div class="performance-monitor__row">
            <span>FPS</span>
            <strong data-metric="fps">--</strong>
          </div>
          <div class="performance-monitor__row">
            <span>Particles</span>
            <strong data-metric="particles">--</strong>
          </div>
        </div>
      </div>
      <div id="tail-viewer" class="tail-viewer">
        <aside class="tail-viewer__panel tail-viewer__panel--layers" data-layer-controls>
          <div class="tail-viewer__layer-buttons" data-layer-buttons></div>
          <div class="tail-viewer__section">
            <div class="tail-viewer__section-header">
              <span>Layer Controls</span>
            </div>
            <div class="tail-viewer__field">
              <label>Enabled</label>
              <input type="checkbox" data-control="layerEnabled" />
            </div>
            <div class="tail-viewer__field">
              <label>Enabled At</label>
              <input type="number" data-control="enabledAt" />
            </div>
            <div class="tail-viewer__field">
              <label>Mode</label>
              <select data-control="mode">
                <option value="follow">follow</option>
                <option value="aura">aura</option>
                <option value="spark">spark</option>
              </select>
            </div>
            <div class="tail-viewer__field">
              <label>Shape</label>
              <select data-control="shape">
                <option value="square">square</option>
                <option value="circle">circle</option>
              </select>
            </div>
            <div class="tail-viewer__field">
              <label>Texture</label>
              <select data-control="texture"></select>
            </div>
            <div class="tail-viewer__field">
              <label>Color Mode</label>
              <select data-control="colorMode">
                <option value="platform">platform</option>
                <option value="fixed">fixed</option>
                <option value="palette">palette</option>
              </select>
            </div>
            <div class="tail-viewer__field tail-viewer__color-row" data-color-fixed>
              <label>Color From</label>
              <input type="color" data-control="colorFrom" />
              <input type="text" data-control="colorFromText" />
            </div>
            <div class="tail-viewer__field tail-viewer__color-row" data-color-fixed>
              <label>Color To</label>
              <input type="color" data-control="colorTo" />
              <input type="text" data-control="colorToText" />
            </div>
            <div class="tail-viewer__field" data-color-palette>
              <label>Palette</label>
              <input type="text" data-control="palette" placeholder="#ff0000, #00ff00" />
            </div>
            <div class="tail-viewer__field" data-color-palette>
              <label>Palette Blend</label>
              <input type="number" data-control="paletteBlend" />
            </div>
            <div class="tail-viewer__field">
              <label>Base Spawn</label>
              <input type="number" data-control="spawnRate" />
            </div>
            <div class="tail-viewer__field">
              <label>Max Spawn</label>
              <input type="number" data-control="maxSpawnRate" />
            </div>
            <div class="tail-viewer__field">
              <label>Life Min</label>
              <input type="number" data-control="lifeMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Life Max</label>
              <input type="number" data-control="lifeMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Scale From Min</label>
              <input type="number" data-control="scaleFromMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Scale From Max</label>
              <input type="number" data-control="scaleFromMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Scale To Min</label>
              <input type="number" data-control="scaleToMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Scale To Max</label>
              <input type="number" data-control="scaleToMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Alpha From Min</label>
              <input type="number" data-control="alphaFromMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Alpha From Max</label>
              <input type="number" data-control="alphaFromMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Alpha To Min</label>
              <input type="number" data-control="alphaToMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Alpha To Max</label>
              <input type="number" data-control="alphaToMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Rotation From Min</label>
              <input type="number" data-control="rotationFromMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Rotation From Max</label>
              <input type="number" data-control="rotationFromMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Rotation To Min</label>
              <input type="number" data-control="rotationToMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Rotation To Max</label>
              <input type="number" data-control="rotationToMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Angular Speed Min</label>
              <input type="number" data-control="angularSpeedMin" />
            </div>
            <div class="tail-viewer__field">
              <label>Angular Speed Max</label>
              <input type="number" data-control="angularSpeedMax" />
            </div>
            <div class="tail-viewer__field">
              <label>Speed Mode</label>
              <select data-control="speedMode">
                <option value="vector">Vx/Vy</option>
                <option value="direction">Direction/Speed</option>
              </select>
            </div>
            <div class="tail-viewer__speed-mode" data-speed-mode="vector">
              <div class="tail-viewer__field">
                <label>Vx Min</label>
                <input type="number" data-control="speedVxMin" />
              </div>
              <div class="tail-viewer__field">
                <label>Vx Max</label>
                <input type="number" data-control="speedVxMax" />
              </div>
              <div class="tail-viewer__field">
                <label>Vy Min</label>
                <input type="number" data-control="speedVyMin" />
              </div>
              <div class="tail-viewer__field">
                <label>Vy Max</label>
                <input type="number" data-control="speedVyMax" />
              </div>
            </div>
            <div class="tail-viewer__speed-mode" data-speed-mode="direction">
              <div class="tail-viewer__field">
                <label>Angle Start</label>
                <input type="number" data-control="speedAngleStart" />
              </div>
              <div class="tail-viewer__field">
                <label>Angle End</label>
                <input type="number" data-control="speedAngleEnd" />
              </div>
              <div class="tail-viewer__field">
                <label>Speed Min</label>
                <input type="number" data-control="speedMin" />
              </div>
              <div class="tail-viewer__field">
                <label>Speed Max</label>
                <input type="number" data-control="speedMax" />
              </div>
            </div>
            <div class="tail-viewer__field">
              <label>Follow Strength</label>
              <input type="number" data-control="followStrength" />
            </div>
            <div class="tail-viewer__field">
              <label>Offset Radius</label>
              <input type="number" data-control="offsetRadius" />
            </div>
            <div class="tail-viewer__field">
              <label>Offset Bias</label>
              <input type="number" data-control="offsetBias" />
            </div>
            <div class="tail-viewer__field">
              <label>Gravity X</label>
              <input type="number" data-control="gravityX" />
            </div>
            <div class="tail-viewer__field">
              <label>Gravity Y</label>
              <input type="number" data-control="gravityY" />
            </div>
            <div class="tail-viewer__field">
              <label>Air Drag</label>
              <input type="number" data-control="airDrag" />
            </div>
          </div>
        </aside>
        <aside class="tail-viewer__panel tail-viewer__panel--rest">
          <div class="tail-viewer__header">
            <div>
              <strong>Tail Viewer</strong>
              <span class="tail-viewer__hint">V to toggle</span>
            </div>
            <div class="tail-viewer__actions">
              <button type="button" data-action="save">Save</button>
              <button type="button" data-action="load">Load</button>
              <button type="button" data-action="reset">Reset</button>
              <button type="button" data-action="dump">Dump JSON</button>
            </div>
          </div>
          <div class="tail-viewer__section">
            <div class="tail-viewer__section-header">
              <span>Global Tail</span>
            </div>
            <div class="tail-viewer__field">
              <label>Snap to Grid</label>
              <input type="checkbox" data-control="snapToGrid" />
            </div>
            <div class="tail-viewer__field">
              <label>Grid Size</label>
              <input type="number" data-control="gridSize" />
            </div>
            <div class="tail-viewer__field">
              <label>Global Alpha</label>
              <input type="number" data-control="globalAlpha" />
            </div>
            <div class="tail-viewer__field">
              <label>Global Spawn</label>
              <input type="number" data-control="globalSpawnMul" />
            </div>
            <div class="tail-viewer__field">
              <label>Global Life</label>
              <input type="number" data-control="globalLifeMul" />
            </div>
            <div class="tail-viewer__field">
              <label>Global Size</label>
              <input type="number" data-control="globalSizeMul" />
            </div>
          </div>
          <div class="tail-viewer__section">
            <div class="tail-viewer__section-header">
              <span>Pixel Overlay</span>
            </div>
            <div class="tail-viewer__field">
              <label>Enabled</label>
              <input type="checkbox" data-control="pixelOverlayEnabled" />
            </div>
            <div class="tail-viewer__field">
              <label>Grid Size</label>
              <input type="number" data-control="pixelOverlayGrid" />
            </div>
            <div class="tail-viewer__field">
              <label>Preset</label>
              <select data-control="pixelOverlayPreset"></select>
            </div>
            <div class="tail-viewer__field tail-viewer__field--stack">
              <label>Pattern</label>
              <textarea data-control="pixelOverlayPattern"></textarea>
            </div>
          </div>
          <div class="tail-viewer__section">
            <div class="tail-viewer__section-header">
              <span>Config Files</span>
            </div>
            <div class="tail-viewer__field">
              <label>Active Config</label>
              <select data-control="configSelect"></select>
            </div>
            <div class="tail-viewer__field">
              <label>Reload</label>
              <button type="button" data-action="configReload">Reload</button>
            </div>
          </div>
          <div class="tail-viewer__section">
            <div class="tail-viewer__section-header">
              <span>Platform Generator</span>
            </div>
            <div class="tail-viewer__field">
              <label>Width</label>
              <input type="number" data-control="platformWidth" />
            </div>
            <div class="tail-viewer__field">
              <label>Height</label>
              <input type="number" data-control="platformHeight" />
            </div>
            <div class="tail-viewer__field">
              <label>Horizontal Range</label>
              <input type="number" data-control="platformHorizontalRange" />
            </div>
            <div class="tail-viewer__field">
              <label>Min Gap</label>
              <input type="number" data-control="platformMinGap" />
            </div>
            <div class="tail-viewer__field">
              <label>Max Gap</label>
              <input type="number" data-control="platformMaxGap" />
            </div>
            <div class="tail-viewer__field">
              <label>Start Count</label>
              <input type="number" data-control="platformStartCount" />
            </div>
            <div class="tail-viewer__field">
              <label>Destroy on Jump</label>
              <input type="checkbox" data-control="platformDestroyOnJump" />
            </div>
            <div class="tail-viewer__field">
              <label>Respawn on Ground</label>
              <input type="checkbox" data-control="platformRespawnOnGround" />
            </div>
            <div class="tail-viewer__field">
              <label>Fade Duration</label>
              <input type="number" data-control="platformFadeDuration" />
            </div>
            <div class="tail-viewer__field">
              <label>Descent Speed</label>
              <input type="number" data-control="platformDescentSpeed" />
            </div>
            <div class="tail-viewer__field tail-viewer__field--stack">
              <label>Colors</label>
              <div class="tail-viewer__platform-colors" data-control="platformColors"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
