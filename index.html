<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tail Jumper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="overlay">click to jump</div>
      <div id="tail-viewer" class="tail-viewer hidden">
        <div class="tail-viewer__header">
          <div>
            <strong>Tail Viewer</strong>
            <span class="tail-viewer__hint">V to toggle</span>
          </div>
          <div class="tail-viewer__actions">
            <button type="button" data-action="save">Save</button>
            <button type="button" data-action="load">Load</button>
            <button type="button" data-action="reset">Reset</button>
            <button type="button" data-action="dump">Dump JSON</button>
          </div>
        </div>
        <div class="tail-viewer__body">
          <div class="tail-viewer__layers">
            <div class="tail-viewer__section-header">Layer Select</div>
            <div data-layer-list></div>
          </div>
          <div class="tail-viewer__controls" data-layer-controls>
            <div class="tail-viewer__section tail-viewer__metrics">
              <div class="tail-viewer__section-header">
                <span>Performance</span>
              </div>
              <div class="tail-viewer__metrics-row">
                <span>FPS</span>
                <strong data-metric="fps">--</strong>
              </div>
              <div class="tail-viewer__metrics-row">
                <span>Particles</span>
                <strong data-metric="particles">--</strong>
              </div>
            </div>
            <div class="tail-viewer__section">
              <div class="tail-viewer__section-header">
                <span>Progression Preview</span>
                <span class="tail-viewer__stage-label" data-progress-stage></span>
              </div>
              <div class="tail-viewer__stage-bar" data-stage-bar></div>
              <div class="tail-viewer__field">
                <label>Progress</label>
                <input type="range" data-control="progress" />
                <span data-value="progress"></span>
              </div>
              <div class="tail-viewer__multipliers" data-progress-multipliers>
                <span data-mul="spawn"></span>
                <span data-mul="life"></span>
                <span data-mul="size"></span>
              </div>
            </div>
            <div class="tail-viewer__section">
              <div class="tail-viewer__section-header">
                <span>Global Tail</span>
              </div>
              <div class="tail-viewer__field">
                <label>Snap to Grid</label>
                <input type="checkbox" data-control="snapToGrid" />
              </div>
              <div class="tail-viewer__field">
                <label>Grid Size</label>
                <input type="range" data-control="gridSize" />
                <span data-value="gridSize"></span>
              </div>
              <div class="tail-viewer__field">
                <label>Global Alpha</label>
                <input type="range" data-control="globalAlpha" />
                <span data-value="globalAlpha"></span>
              </div>
              <div class="tail-viewer__field">
                <label>Global Spawn</label>
                <input type="range" data-control="globalSpawnMul" />
                <span data-value="globalSpawnMul"></span>
              </div>
              <div class="tail-viewer__field">
                <label>Global Life</label>
                <input type="range" data-control="globalLifeMul" />
                <span data-value="globalLifeMul"></span>
              </div>
              <div class="tail-viewer__field">
                <label>Global Size</label>
                <input type="range" data-control="globalSizeMul" />
                <span data-value="globalSizeMul"></span>
              </div>
            </div>
            <div class="tail-viewer__section">
              <div class="tail-viewer__section-header">
                <span>Progress Stages</span>
                <button type="button" class="tail-viewer__small-button" data-action="add-stage">
                  Add
                </button>
              </div>
              <div class="tail-viewer__stage-list" data-stage-list></div>
            </div>
            <div class="tail-viewer__field">
              <label>Enabled</label>
              <input type="checkbox" data-control="layerEnabled" />
            </div>
            <div class="tail-viewer__field">
              <label>Enabled At</label>
              <input type="range" data-control="enabledAt" />
              <span data-value="enabledAt"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Mode</label>
              <select data-control="mode">
                <option value="follow">follow</option>
                <option value="aura">aura</option>
                <option value="spark">spark</option>
              </select>
            </div>
            <div class="tail-viewer__field">
              <label>Shape</label>
              <select data-control="shape">
                <option value="square">square</option>
                <option value="circle">circle</option>
              </select>
            </div>
            <div class="tail-viewer__field">
              <label>Color Mode</label>
              <select data-control="colorMode">
                <option value="platform">platform</option>
                <option value="fixed">fixed</option>
                <option value="palette">palette</option>
              </select>
            </div>
            <div class="tail-viewer__field tail-viewer__color-row" data-color-fixed>
              <label>Color</label>
              <input type="color" data-control="color" />
              <input type="text" data-control="colorText" />
            </div>
            <div class="tail-viewer__field" data-color-palette>
              <label>Palette</label>
              <input type="text" data-control="palette" placeholder="#ff0000, #00ff00" />
            </div>
            <div class="tail-viewer__field" data-color-palette>
              <label>Palette Blend</label>
              <input type="range" data-control="paletteBlend" />
              <span data-value="paletteBlend"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Base Spawn</label>
              <input type="range" data-control="spawnRate" />
              <span data-value="spawnRate"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Max Spawn</label>
              <input type="range" data-control="maxSpawnRate" />
              <span data-value="maxSpawnRate"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Life</label>
              <input type="range" data-control="life" />
              <span data-value="life"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Life Jitter</label>
              <input type="range" data-control="lifeJitter" />
              <span data-value="lifeJitter"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Size</label>
              <input type="range" data-control="size" />
              <span data-value="size"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Size Jitter</label>
              <input type="range" data-control="sizeJitter" />
              <span data-value="sizeJitter"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Alpha</label>
              <input type="range" data-control="alpha" />
              <span data-value="alpha"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Follow Strength</label>
              <input type="range" data-control="followStrength" />
              <span data-value="followStrength"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Offset Radius</label>
              <input type="range" data-control="offsetRadius" />
              <span data-value="offsetRadius"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Offset Bias</label>
              <input type="range" data-control="offsetBias" />
              <span data-value="offsetBias"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Drift Speed</label>
              <input type="range" data-control="driftSpeed" />
              <span data-value="driftSpeed"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Drift Jitter</label>
              <input type="range" data-control="driftJitter" />
              <span data-value="driftJitter"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Gravity</label>
              <input type="range" data-control="gravity" />
              <span data-value="gravity"></span>
            </div>
            <div class="tail-viewer__field">
              <label>Air Push</label>
              <input type="range" data-control="airPush" />
              <span data-value="airPush"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
